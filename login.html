<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body class="auth"><form id="login"><h1>Employee Project Manager</h1><h2>Login</h2><input id="user" placeholder="Username or Email" required><input id="pass" type="password" placeholder="Password" required><button>Login</button><p id="msg"></p><a href="register.html">Create account</a></form><script>login.onsubmit=async e=>{e.preventDefault();let r=await fetch('api/login.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})}),d=await r.json();msg.textContent=d.message;if(d.success)location='index.html'}</script></body></html>
