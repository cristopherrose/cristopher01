<!doctype html>
<html>
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Employee Project Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header><div><h1>Employee Project Manager</h1><small id="who"></small></div><button onclick="logout()">Logout</button></header><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('employees')">Employees</button><button onclick="show('projects')">Projects</button><button onclick="show('tasks')">Tasks</button></nav><main><section id="dashboard"><h2>Dashboard</h2><div class="cards"><article>Employees <b id="ec">0</b></article><article>Projects <b id="pc">0</b></article><article>Tasks <b id="tc">0</b></article><article>Completed <b id="cc">0</b></article></div></section><section id="employees" class="hide"><h2>Employees</h2><form id="ef"><input id="en" placeholder="Name" required><input id="ep" placeholder="Position" required><input id="ed" placeholder="Department" required><button>Add</button></form><table><thead><tr><th>ID</th><th>Name</th><th>Position</th><th>Department</th><th></th></tr></thead><tbody id="et"></tbody></table></section><section id="projects" class="hide"><h2>Projects</h2><form id="pf"><input id="pn" placeholder="Project" required><input id="pm" placeholder="Manager" required><input id="pd" type="date" required><select id="ps"><option>Not Started</option><option>In Progress</option><option>Completed</option></select><button>Add</button></form><table><thead><tr><th>ID</th><th>Project</th><th>Manager</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody id="pt"></tbody></table></section><section id="tasks" class="hide"><h2>Tasks</h2><form id="tf"><input id="tn" placeholder="Task" required><select id="te"></select><select id="tp"></select><select id="ti"><option>Low</option><option selected>Medium</option><option>High</option></select><select id="ts"><option>Pending</option><option>In Progress</option><option>Completed</option></select><button>Add</button></form><table><thead><tr><th>ID</th><th>Task</th><th>Employee</th><th>Project</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody id="tt"></tbody></table></section></main><script src="script.js"></script></body></html>
